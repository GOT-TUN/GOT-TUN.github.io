<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a2233">
<title>購入ありがとうございます｜反射軌道シミュレーター</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    background: #101623; color: #eef2f8; -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 36px 16px 40px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 10px; }
  p { color: #aeb9cc; font-size: 14px; line-height: 1.8; }
  .code-box {
    background: #1a2233; border: 2px dashed #d99a17; border-radius: 14px;
    padding: 20px 14px; margin: 20px 0;
  }
  .code-label { font-size: 13px; color: #cfd8ea; margin: 0 0 6px; }
  .code { font-size: 30px; font-weight: 800; letter-spacing: 2px; color: #ffd83d; margin: 0; }
  a.open-btn {
    display: block; padding: 15px; border-radius: 11px; margin-top: 8px;
    background: #b97e0a; color: #fff; font-size: 17px; font-weight: 700; text-decoration: none;
  }
  .small { font-size: 12px; color: #93a3bd; line-height: 1.7; text-align: left; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎉 購入ありがとうございます</h1>
  <p>あなたのパスコードはこちらです。</p>
  <div class="code-box">
    <p class="code-label">パスコード</p>
    <p class="code">hansha480</p>
  </div>
  <a class="open-btn" href="./index.html">シミュレーターを開く</a>
  <p class="small">
    使い方：シミュレーターを開いたら、パスコード入力画面で上のコードを入力してください。入力はその端末に記憶されるので、次回からは入力不要です。<br>
    このページをブックマークするか、パスコードをメモしておくことをおすすめします。<br>
    パスコードは購入者本人のためのものです。他人への共有・転売はご遠慮ください。
  </p>
</div>
</body>
</html>
